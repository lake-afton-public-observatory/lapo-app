name: LAPOApp
options:
  bundleIdPrefix: com.lakeafton
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  LAPOApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LAPOApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lakeafton.app
        INFOPLIST_FILE: LAPOApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - LAPOAppTests

  LAPOAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LAPOAppTests
    dependencies:
      - target: LAPOApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lakeafton.app.tests
